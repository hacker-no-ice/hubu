[package]
name = "hubu-api"
version = "0.3.0"
description = "Local HTTP API and server for Hubu agent spend control"
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["ai-agents", "budgets", "payments", "policy"]
categories = ["finance", "web-programming::http-server"]
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
hubu-common.workspace = true
hubu-core.workspace = true
hubu-wallet.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
thiserror.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[[bin]]
name = "hubu-server"
path = "src/main.rs"
