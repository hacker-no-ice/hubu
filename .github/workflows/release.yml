name: Release

on:
  schedule:
    - cron: '0 10 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to publish
        required: true
        default: canary
        type: choice
        options:
          - canary
          - stable
      version:
        description: Stable SemVer tag (required only for the stable channel)
        required: false
        type: string
      source_commit:
        description: Exact 40-character commit SHA from main to publish
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve immutable release identity
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.release.outputs.source_commit }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: release
        name: Validate version and source
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail

          canary_release_is_complete() {
            release_json="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets,isDraft,isPrerelease,targetCommitish 2>/dev/null)" || return 1
            jq -e \
              --arg source_commit "${source_commit}" \
              --arg macos_x86 "hubu-${version}-x86_64-apple-darwin.tar.gz" \
              --arg macos_arm "hubu-${version}-aarch64-apple-darwin.tar.gz" \
              '.isDraft == false and
               .isPrerelease == true and
               .targetCommitish == $source_commit and
               ([.assets[] | select(.state == "uploaded" and .size > 0) | .name] | sort) ==
               (["SHA256SUMS", $macos_x86, $macos_arm] | sort)' \
              <<<"${release_json}" >/dev/null
          }

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${INPUT_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "source_commit must be an exact 40-character lowercase commit SHA" >&2
              exit 1
            fi
            git fetch origin main
            git cat-file -e "${INPUT_SOURCE_COMMIT}^{commit}"
            git merge-base --is-ancestor "${INPUT_SOURCE_COMMIT}" origin/main
            source_commit="${INPUT_SOURCE_COMMIT}"
            if [[ "${INPUT_CHANNEL}" == "canary" ]]; then
              git checkout --detach "${source_commit}"
              short_commit="${source_commit:0:12}"
              base_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hubu-api") | .version')"
              version="${base_version}-main.${short_commit}"
              tag="main-${source_commit}"
              prerelease=true

            elif [[ "${INPUT_CHANNEL}" == "stable" ]]; then
              if [[ ! "${INPUT_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Stable version must match vMAJOR.MINOR.PATCH" >&2
                exit 1
              fi
              version="${INPUT_VERSION}"
              tag="${INPUT_VERSION}"
              prerelease=false
            else
              echo "channel must be canary or stable" >&2
              exit 1
            fi
          else
            git fetch origin main
            source_commit="$(git rev-parse origin/main)"
            short_commit="${source_commit:0:12}"
            base_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hubu-api") | .version')"
            version="${base_version}-main.${short_commit}"
            tag="main-${source_commit}"
            prerelease=true

          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            if [[ "${prerelease}" == "true" ]] && canary_release_is_complete; then
              echo "No release needed: complete immutable canary ${tag} is already published"
              echo "should_release=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "Refusing to mutate existing release tag ${tag}" >&2
            exit 1
          fi

          {
            echo "source_commit=${source_commit}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "should_release=true"
          } >> "${GITHUB_OUTPUT}"

  checks:
    name: Required release checks
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_commit }}

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run core integration flow
        run: ./scripts/integration-core-flow.sh

      - name: Test release packaging
        run: ./scripts/test-release-packaging.sh

      - name: Check immutable release workflow
        run: python3 scripts/check-release-workflow.py

      - name: Verify locked release build
        env:
          HUBU_PRODUCT_VERSION: ${{ needs.resolve.outputs.version }}
          HUBU_SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          GONGBU_PRODUCT_VERSION: ${{ needs.resolve.outputs.version }}
          GONGBU_SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          GONGBU_BUILD_ID: ${{ github.run_id }}.${{ github.run_attempt }}
        run: >-
          cargo build --release --locked
          --bin hubu
          --bin hubu-server
          --bin hubu-unified-mcp
          --bin gongbu-server

      - name: Verify deterministic unified archive
        run: >-
          ./scripts/test-release-archive-runtime.sh
          "${{ needs.resolve.outputs.version }}"
          "${{ needs.resolve.outputs.source_commit }}"

  build:
    name: Build ${{ matrix.target }}
    needs: [resolve, checks]
    strategy:
      fail-fast: false
      matrix:
        # HUB-110 temporary zero-user pre-launch exception: macOS only.
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_commit }}

      - name: Install protobuf compiler on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Install protobuf compiler on macOS
        if: runner.os == 'macOS'
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf

      - name: Build locked release binaries
        env:
          HUBU_PRODUCT_VERSION: ${{ needs.resolve.outputs.version }}
          HUBU_SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          GONGBU_PRODUCT_VERSION: ${{ needs.resolve.outputs.version }}
          GONGBU_SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          GONGBU_BUILD_ID: ${{ github.run_id }}.${{ github.run_attempt }}
        run: >-
          cargo build --release --locked --target "${{ matrix.target }}"
          --bin hubu
          --bin hubu-server
          --bin hubu-unified-mcp
          --bin gongbu-server

      - name: Package binaries and provenance
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          TARGET: ${{ matrix.target }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./scripts/package-release-archive.sh \
            "${RELEASE_VERSION}" \
            "${SOURCE_COMMIT}" \
            "${TARGET}" \
            "target/${TARGET}/release" \
            dist \
            "${REPOSITORY}" \
            "https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hubu-package-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable GitHub release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hubu-package-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          channel_note="Stable version channel. Experimental, local-first software using a mock payment rail; not approved for real-money production use. Consumers may pin this exact tag and checksum."
          if [[ "${PRERELEASE}" == "true" ]]; then
            prerelease_flag+=(--prerelease)
            channel_note="Commit-addressed canary prerelease. Experimental, local-first software using a mock payment rail; not approved for real-money production use. Pin this exact tag and checksum; do not depend on a rolling newest build."
          fi
          notes=$(printf 'Hubu product version: `%s`\n\nSource commit: `%s`\n\nSupported agent surface: `hubu-unified-mcp`\n\nDeprecated agent surfaces excluded: `hubu-mcp-server`, `gongbu-mcp`\n\nBinaries: `hubu`, `hubu-server`, `hubu-unified-mcp`, `gongbu-server`\n\nCutover: HUB-97, authorized by the reviewed HUB-111 GO; standalone source removal follows in HUB-98.\n\nExecutor contract: `hubu-spend-executor-v4.2`\n\n%s' "${RELEASE_VERSION}" "${SOURCE_COMMIT}" "${channel_note}")
          gh release create "${RELEASE_TAG}" \
            dist/*.tar.gz dist/SHA256SUMS \
            --target "${SOURCE_COMMIT}" \
            --title "Hubu ${RELEASE_VERSION}" \
            --notes "${notes}" \
            "${prerelease_flag[@]}"

  smoke:
    name: Smoke ${{ matrix.os }} release
    needs: [resolve, publish]
    strategy:
      fail-fast: false
      matrix:
        # HUB-110 temporary zero-user pre-launch exception: macOS only.
        include:
          - os: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_commit }}

      - name: Download, verify, and start published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          ./scripts/release-smoke-test.sh
          "${{ needs.resolve.outputs.tag }}"
          "hubu-${{ needs.resolve.outputs.version }}-${{ matrix.target }}.tar.gz"
          "${{ needs.resolve.outputs.version }}"
          "${{ needs.resolve.outputs.source_commit }}"
