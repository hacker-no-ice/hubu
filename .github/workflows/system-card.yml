name: System card

# Measure the newest stable release with the public proof kits and open a PR
# that publishes its system card. A human reviews and merges that PR; nothing
# here merges, edits a release, or calls a provider.
#
# The Release workflow publishes with GITHUB_TOKEN, which never emits
# `release: published` to other workflows, so this follows Release runs.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release:
        description: Published stable tag to measure, such as v0.2.5
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: system-card
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve stable release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      base: ${{ steps.resolve.outputs.base }}
      needed: ${{ steps.resolve.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve the release and whether its card is missing
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            release="${INPUT_RELEASE}"
          else
            # The latest release excludes drafts and prereleases; canary and
            # candidate runs therefore resolve to an already measured stable.
            release="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          fi
          if [[ ! "${release}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release must be a stable vMAJOR.MINOR.PATCH tag: ${release}" >&2
            exit 1
          fi
          state="$(gh release view "${release}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          if [[ "${state}" != "false false" ]]; then
            echo "${release} is not a published stable release" >&2
            exit 1
          fi
          needed=true
          if [[ -f "site/app/releases/${release}/report/page.tsx" ]]; then
            echo "${release} already has a measured system card."
            needed=false
          elif [[ ! -f "site/app/releases/${release}/page.tsx" ]]; then
            echo "Write the ${release} release notes page before measuring its card." >&2
            exit 1
          elif [[ -n "$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "system-card/${release}" --state open --json number --jq '.[].number')" ]]; then
            echo "A system card PR for ${release} is already open."
            needed=false
          fi
          {
            echo "release=${release}"
            echo "base=$(git rev-parse HEAD)"
            echo "needed=${needed}"
          } >> "${GITHUB_OUTPUT}"

  measure:
    name: Run proof kits on macOS
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the release's pinned Rust toolchain
        env:
          RELEASE: ${{ needs.resolve.outputs.release }}
        run: |
          set -euo pipefail
          toolchain="$(git show "refs/tags/${RELEASE}:rust-toolchain.toml" | sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p')"
          [[ -n "${toolchain}" ]]
          rustup toolchain install "${toolchain}" --profile minimal

      - name: Run every proof kit
        id: kits
        env:
          RELEASE: ${{ needs.resolve.outputs.release }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e -uo pipefail
          ./break-hubu/run-all.sh --release "${RELEASE}" --output "${RUNNER_TEMP}/evidence" --cache "${RUNNER_TEMP}/build-cache"
          code=$?
          # 1 = a claim does not hold, 2 = a claim was not tested. Both are
          # results to publish; anything else is a harness failure.
          if [[ "${code}" -gt 2 ]]; then
            echo "Proof kits failed with exit ${code}" >&2
            exit "${code}"
          fi
          echo "exit=${code}" >> "${GITHUB_OUTPUT}"

      - name: Keep the raw public evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-kit-evidence-${{ needs.resolve.outputs.release }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Render the card
        run: python3 break-hubu/render-report.py "${RUNNER_TEMP}/evidence"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build and test the site with the card
        working-directory: site
        run: |
          npm ci
          npm run lint
          npm test

      - name: Check documentation links
        run: python3 scripts/check-doc-links.py

      - name: Package the card as a patch
        env:
          RELEASE: ${{ needs.resolve.outputs.release }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/card"
          git add -A break-hubu/cards site/app/releases "site/public/break-hubu/evidence/${RELEASE}"
          git diff --cached --binary > "${RUNNER_TEMP}/card/card.patch"
          cp "break-hubu/cards/${RELEASE}.json" "${RUNNER_TEMP}/card/verdicts.json"
          if git status --porcelain --untracked-files=all | grep -qv '^[AM] '; then
            echo "Rendering changed files outside the card:" >&2
            git status --porcelain --untracked-files=all >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-card-${{ needs.resolve.outputs.release }}
          path: ${{ runner.temp }}/card
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Open the system card PR
    needs: [resolve, measure]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.base }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: system-card-${{ needs.resolve.outputs.release }}
          path: ${{ runner.temp }}/card

      - name: Commit the card and open a PR for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.resolve.outputs.release }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="system-card/${RELEASE}"
          git apply --index "${RUNNER_TEMP}/card/card.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -m "docs(release): publish the measured ${RELEASE} system card" \
            -m "Generated by the System card workflow from the public proof kits run against the published ${RELEASE} tag: ${RUN_URL}"
          git push origin "HEAD:refs/heads/${branch}"
          table="$(python3 - "${RUNNER_TEMP}/card/verdicts.json" <<'PY'
          import json, sys
          labels = {'holds': 'Holds', 'holds-with-caveat': 'Holds with caveat', 'does-not-hold': 'Does not hold', 'not-tested': 'Not tested'}
          verdicts = json.load(open(sys.argv[1]))['verdicts']
          print('| Experiment | Verdict |\n| --- | --- |')
          for episode, verdict in verdicts.items():
              print(f'| `{episode}` | {labels[verdict]} |')
          PY
          )"
          body="$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "The System card workflow ran the four public proof kits against the published \`${RELEASE}\` tag on macOS and rendered its system card. Run: ${RUN_URL}" \
            "${table}" \
            "**Human review required** (see break-hubu/release-checklist.md): inspect every result, including incomplete or contradicted claims; check the caveats and known limits still describe this release; and decide whether to publish a disclosed failure or fix it first. Do not alter acceptance criteria to manufacture a pass." \
            "PRs opened with GITHUB_TOKEN do not start other workflows. This run already linted and tested the site with the card. To run the required checks here, push a commit to this branch or close and reopen the PR. After merging, attach \`site/public/break-hubu/evidence/${RELEASE}/evidence.zip\` to the GitHub release.")"
          gh pr create --repo "${GITHUB_REPOSITORY}" --base "${BASE_BRANCH}" --head "${branch}" \
            --title "docs(release): publish the measured ${RELEASE} system card" --body "${body}"
