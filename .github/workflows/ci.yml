name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Ordinary CI is deliberately unable to opt into external Gongbu or provider traffic.
  GONGBU_MCP_INTEGRATION: "0"
  GONGBU_SANDBOX_HUBU_MODE: mock
  GONGBU_SANDBOX_PROVIDER_MODE: mock

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Gongbu Hubu v4 client recovery
        run: cargo test --workspace --locked 'hubu::tests::'

      - name: Run all workspace tests
        run: cargo test --workspace --all-targets --locked

      - name: Build all production binaries with locked dependencies
        run: >-
          cargo build --release --locked
          --bin hubu
          --bin hubu-server
          --bin hubu-mcp-server
          --bin gongbu-server
          --bin gongbu-mcp

      - name: Check default credentials cannot be committed
        run: ./scripts/check-default-credential-ignore.sh

      - name: Check public Cargo metadata
        run: python3 scripts/check-cargo-metadata.py

      - name: Check Hubu/Gongbu dependency boundary
        run: python3 scripts/check-workspace-boundary.py

      - name: Check ordinary CI cannot enable live provider spend
        run: python3 scripts/check-ci-provider-safety.py

      - name: Run core integration flow
        run: ./scripts/integration-core-flow.sh

      - name: Build docs
        run: cargo doc --workspace --no-deps --locked

  msrv:
    name: Check MSRV (Rust 1.88.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check workspace with MSRV
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked

  security:
    name: Security policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Rust advisories, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories licenses sources
