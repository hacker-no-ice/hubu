name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Ordinary CI is deliberately unable to opt into external Gongbu or provider traffic.
  GONGBU_MCP_INTEGRATION: "0"
  GONGBU_SANDBOX_HUBU_MODE: mock
  GONGBU_SANDBOX_PROVIDER_MODE: mock

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Gongbu Hubu v4 client recovery
        run: cargo test --workspace --locked 'hubu::tests::'

      - name: Run all workspace tests
        run: cargo test --workspace --all-targets --locked

      - name: Build all production binaries with locked dependencies
        if: github.event_name == 'push'
        run: >-
          cargo build --release --locked
          --bin hubu
          --bin hubu-server
          --bin hubu-unified-mcp
          --bin gongbu-server

      - name: Test unified release packaging
        run: ./scripts/test-release-packaging.sh

      - name: Test exact source installer
        run: ./scripts/test-install-from-source.sh

      - name: Check immutable release workflow
        run: python3 scripts/check-release-workflow.py

      - name: Check default credentials cannot be committed
        run: ./scripts/check-default-credential-ignore.sh

      - name: Check public Cargo metadata
        run: python3 scripts/check-cargo-metadata.py

      - name: Check Hubu/Gongbu dependency boundary
        run: python3 scripts/check-workspace-boundary.py

      - name: Check ordinary CI cannot enable live provider spend
        run: python3 scripts/check-ci-provider-safety.py

      - name: Check proactive security workflow boundaries
        run: python3 scripts/check-security-advisory-workflow.py

      - name: Test advisory detection and targeted remediation
        run: python3 scripts/test-security-advisories.py

      - name: Test advisory publication and duplicate suppression
        run: node --test scripts/test-security-advisories-github.js

      - name: Test lockfile publication and branch ownership
        run: bash scripts/test-security-advisories-push.sh

      - name: Run core integration flow
        run: ./scripts/integration-core-flow.sh

      - name: Run executor-neutral Hubu conformance suite
        run: ./scripts/integration-executor-conformance.sh

      - name: Qualify standalone MCP authorization with an external executor
        run: ./scripts/integration-standalone-mcp-executor.sh

      - name: Run Hubu-to-Gongbu executor E2E
        run: ./scripts/integration-hubu-gongbu-executor.sh

      - name: Run unified MCP routing and failure-isolation matrix
        run: ./scripts/integration-unified-mcp.sh

      - name: Qualify governance history and agent read queries
        run: ./scripts/integration-governance-observability.sh

      - name: Build docs
        run: cargo doc --workspace --no-deps --locked

  msrv:
    name: Check MSRV (Rust 1.88.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check workspace with MSRV
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked

  security:
    name: Security policy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Rust advisories, licenses, and sources
        id: policy
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked
          command-arguments: advisories licenses sources

      - name: Install matching diagnostic scanner
        if: steps.policy.outcome == 'failure' && github.event_name == 'pull_request'
        uses: ./.github/actions/install-cargo-deny

      - name: Explain which advisories also affect main
        if: steps.policy.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          report_dir="$RUNNER_TEMP/security-diagnostics"
          baseline_dir="$RUNNER_TEMP/security-main"
          mkdir -p "$report_dir"
          python3 scripts/security-advisories.py scan --run \
            --output "$report_dir/pr.json" --markdown "$report_dir/pr.md"
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          git worktree add --detach "$baseline_dir" FETCH_HEAD
          # Fetch baseline crate metadata first; --offline then reuses the exact
          # RustSEC snapshot already used for the PR's structured scan.
          cargo fetch --manifest-path "$baseline_dir/Cargo.toml" --locked
          python3 scripts/security-advisories.py scan --run --offline --cwd "$baseline_dir" \
            --output "$report_dir/main.json" --markdown "$report_dir/main.md"
          python3 scripts/security-advisories.py scan --run --offline \
            --baseline "$report_dir/main.json" \
            --output "$report_dir/classified.json" --markdown "$report_dir/classified.md"
          cat "$report_dir/classified.md" >> "$GITHUB_STEP_SUMMARY"
          echo '::notice::Security policy remains required. See the job summary for advisories already affecting main and PR-specific findings.'

      - name: Enforce security policy result
        if: always() && steps.policy.outcome != 'success'
        run: exit 1
