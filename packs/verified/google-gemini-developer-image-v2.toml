currency = "USD"
selector = { image_size = "4k" }
components = [{ unit = "image", rate_numerator_minor = 113, rate_denominator = 10 }]

# Gemini 3 Pro Image (Nano Banana Pro). Never a default: an operator binds its
# contract explicitly and an agent selects its target by model.
[[models]]
model = "gemini-3-pro-image"
provider_config_version = "hubu-gemini-3-pro-image-t2i-2026-10-28-v1"
pricing_version = "google-gemini-3-pro-image-usd-2026-10-28-v1"
pricing_reviewed_on = "2026-10-28"

[[models.pricing_rules]]
rule_id = "google-gemini-3-pro-image-1k-2026-10-28-v1"
currency = "USD"
selector = { image_size = "1k" }
components = [{ unit = "image", rate_numerator_minor = 134, rate_denominator = 10 }]

[[models.pricing_rules]]
