# Verified provider pack: Google Gemini Developer API image editing, v2
# contracts (HUB-252).
#
# Same input-image handling as google-gemini-developer-image-edit.toml (the
# v1 contracts, kept as is). v2 requires an explicit aspect ratio, certifies
# the exact output size of each aspect ratio at each image size, and adds
# Gemini 3 Pro Image. Without an aspect ratio Gemini matches the input image's
# shape, which no preset can certify, so the agent always names one.
#
# Reviewed 2026-10-28 against https://ai.google.dev/gemini-api/docs/pricing
# and https://ai.google.dev/gemini-api/docs/image-generation. Output images
# keep the text-to-image per-image rates of
# google-gemini-developer-image-v2.toml, at the same certified sizes. Each
# input image is billed as input tokens: on Flash Image, Flash Lite Image and
# Nano Banana 2.1 at the Gemini 3 default of 1,120 tokens, 1,120 × $0.50 per
# 1M = 0.056¢, 1,120 × $0.25 per 1M = 0.028¢ and 1,120 × $1.50 per 1M =
# 0.168¢; on Pro Image Google sets an input image at
# 560 tokens, 560 × $2.00 per 1M = 0.112¢. Text prompt input tokens and text
# and thinking output tokens stay unpriced, as in v1.
schema_version = 1
pack_id = "google-gemini-developer-image-edit"
pack_version = "2026-10-28.1"
provider = "google"
display_name = "Google Gemini Developer API"
billing_merchant = "merchant:google"
capability = "capability:image:edit"
workload_type = "image_edit"
archetype = "sync_fixed"
adapter = "gemini_developer_image"
pricing_trust = "verified"

[transport]
endpoint = "https://generativelanguage.googleapis.com"
api_version = "v1beta"
allowed_hosts = ["generativelanguage.googleapis.com"]
auth_header = "x-goog-api-key"
credential = "gemini"
timeout_ms = 30000

[request]
path = "/v1beta/interactions"

[request.body]
model = "{{model}}"
input = [{ type = "text", text = "{{prompt}}" }, "{{input_images}}"]
response_format = { type = "image", image_size = "{{image_size|upper}}", aspect_ratio = "{{aspect_ratio}}" }

[[parameters]]
name = "prompt"
type = "string"
required = true
max_length = 32000

# Artifact IDs of images this account's earlier governed executions delivered.
[[parameters]]
name = "input_images"
type = "images"
required = true
min = 1
max = 4
quantity = "input_images"
item = { type = "image", mime_type = "{{image.media_type}}", data = "{{image.data}}" }

[[parameters]]
name = "image_count"
type = "integer"
min = 1
max = 1
default = 1
quantity = "image_count"

[[parameters]]
name = "image_size"
type = "enum"
values = ["1k", "2k", "4k"]
required = true
selector = "image_size"

[[parameters]]
name = "aspect_ratio"
type = "enum"
values = ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"]
required = true

[[size_presets]]
when = { image_size = "1k", aspect_ratio = "1:1" }
size = [1024, 1024]

[[size_presets]]
when = { image_size = "1k", aspect_ratio = "2:3" }
size = [848, 1264]

[[size_presets]]
when = { image_size = "1k", aspect_ratio = "3:2" }
size = [1264, 848]

[[size_presets]]
when = { image_size = "1k", aspect_ratio = "3:4" }
size = [896, 1200]

[[size_presets]]
when = { image_size = "1k", aspect_ratio = "4:3" }
size = [1200, 896]

[[size_presets]]
when = { image_size = "1k", aspect_ratio = "4:5" }
size = [928, 1152]

[[size_presets]]
when = { image_size = "1k", aspect_ratio = "5:4" }
size = [1152, 928]

[[size_presets]]
when = { image_size = "1k", aspect_ratio = "9:16" }
size = [768, 1376]

[[size_presets]]
when = { image_size = "1k", aspect_ratio = "16:9" }
size = [1376, 768]

[[size_presets]]
when = { image_size = "1k", aspect_ratio = "21:9" }
size = [1584, 672]

[[size_presets]]
when = { image_size = "2k", aspect_ratio = "1:1" }
size = [2048, 2048]

[[size_presets]]
when = { image_size = "2k", aspect_ratio = "2:3" }
size = [1696, 2528]

[[size_presets]]
when = { image_size = "2k", aspect_ratio = "3:2" }
size = [2528, 1696]

[[size_presets]]
when = { image_size = "2k", aspect_ratio = "3:4" }
size = [1792, 2400]

[[size_presets]]
when = { image_size = "2k", aspect_ratio = "4:3" }
size = [2400, 1792]

[[size_presets]]
when = { image_size = "2k", aspect_ratio = "4:5" }
size = [1856, 2304]

[[size_presets]]
when = { image_size = "2k", aspect_ratio = "5:4" }
size = [2304, 1856]

[[size_presets]]
when = { image_size = "2k", aspect_ratio = "9:16" }
size = [1536, 2752]

[[size_presets]]
when = { image_size = "2k", aspect_ratio = "16:9" }
size = [2752, 1536]

[[size_presets]]
when = { image_size = "2k", aspect_ratio = "21:9" }
size = [3168, 1344]

[[size_presets]]
when = { image_size = "4k", aspect_ratio = "1:1" }
size = [4096, 4096]

[[size_presets]]
when = { image_size = "4k", aspect_ratio = "2:3" }
size = [3392, 5056]

[[size_presets]]
when = { image_size = "4k", aspect_ratio = "3:2" }
size = [5056, 3392]

[[size_presets]]
when = { image_size = "4k", aspect_ratio = "3:4" }
size = [3584, 4800]

[[size_presets]]
when = { image_size = "4k", aspect_ratio = "4:3" }
size = [4800, 3584]

[[size_presets]]
when = { image_size = "4k", aspect_ratio = "4:5" }
size = [3712, 4608]

[[size_presets]]
when = { image_size = "4k", aspect_ratio = "5:4" }
size = [4608, 3712]

[[size_presets]]
when = { image_size = "4k", aspect_ratio = "9:16" }
size = [3072, 5504]

[[size_presets]]
when = { image_size = "4k", aspect_ratio = "16:9" }
size = [5504, 3072]

[[size_presets]]
when = { image_size = "4k", aspect_ratio = "21:9" }
size = [6336, 2688]

[response]
request_id_headers = ["x-goog-request-id", "x-request-id"]
provider_request_id = "/id"
usage = { images = "/steps[type=model_output]/content[type=image]", input_tokens = "/usage/total_input_tokens", output_tokens = "/usage/total_output_tokens" }
optional_usage = ["input_tokens", "output_tokens"]
artifact_items = "/steps[type=model_output]/content[type=image]"
artifact_base64 = "/data"

[artifacts]
media_types = ["image/png", "image/jpeg"]

[[models]]
model = "gemini-3.1-flash-lite-image"
provider_config_version = "hubu-gemini-3.1-flash-lite-image-edit-2026-10-28-v2"
pricing_version = "google-gemini-3.1-flash-lite-image-edit-usd-2026-10-28-v2"
pricing_reviewed_on = "2026-10-28"
parameter_values = { image_size = ["1k"] }

[[models.pricing_rules]]
rule_id = "google-gemini-3.1-flash-lite-image-edit-1k-2026-10-28-v2"
currency = "USD"
selector = { image_size = "1k" }
components = [
  { unit = "image", rate_numerator_minor = 336, rate_denominator = 100 },
  { unit = "input_image", rate_numerator_minor = 28, rate_denominator = 1000 },
]

[[models]]
model = "gemini-3.1-flash-image"
provider_config_version = "hubu-gemini-3.1-flash-image-edit-2026-10-28-v2"
pricing_version = "google-gemini-3.1-flash-image-edit-usd-2026-10-28-v2"
pricing_reviewed_on = "2026-10-28"

[[models.pricing_rules]]
