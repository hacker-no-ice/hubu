# Verified provider pack: Black Forest Labs FLUX 3 Image Klein text-to-image
# (HUB-329).
#
# Klein is BFL's compact, open-weights FLUX 3 Image model. BFL's API serves
# one variant, Klein (Distilled), at /v1/flux-3-image-klein; Klein Base is
# open weights only, with no hosted endpoint. Request, reviewed 2026-10-29
# against BFL's API reference ("Generate an image with FLUX 3 Klein",
# https://docs.bfl.ml/api-reference/utility/generate-an-image-with-flux-3-klein.md):
# the same prompt, resolution tiers and aspect ratios as FLUX 3 Image, with
# the same BFL polling and delivery as bfl-flux-3-image-v2.toml. Klein has no
# web-search grounding and its request schema refuses unknown fields, so
# unlike FLUX 3 Image the request carries no `grounding` field.
#
# BFL prices Klein by resolution tier; the aspect ratio doesn't change the
# price within a tier. Pricing reviewed 2026-10-29 against
# https://bfl.ai/pricing (the rendered page and its JSON-LD Product data
# agree). BFL doesn't publish the exact pixel size of each tier and ratio,
# so this pack certifies the tier and ratio it sends, not a size.
# contracts/provider-contracts-v1.json carries this pack's checked-in
# projection, and Gongbu's tests fail if the two ever disagree.
schema_version = 1
pack_id = "bfl-flux-3-image-klein"
pack_version = "2026-10-29.1"
provider = "flux"
display_name = "Black Forest Labs FLUX 3 Image Klein"
billing_merchant = "merchant:black-forest-labs"
capability = "capability:image:generate"
workload_type = "image_generation"
archetype = "async_poll"
adapter = "flux2_api"
pricing_trust = "verified"

[transport]
endpoint = "https://api.bfl.ai"
api_version = "v1"
# Regional API hosts receive the credential when BFL returns them for polling.
allowed_hosts = ["api.bfl.ai", "api.*.bfl.ai"]
auth_header = "x-key"
credential = "bfl_flux3_image_klein"
timeout_ms = 270000

[request]
path = "/v1/flux-3-image-klein"

[request.body]
prompt = "{{prompt}}"
resolution = "{{image_size}}"
aspect_ratio = "{{aspect_ratio}}"
safety_tolerance = "{{options.safety_tolerance}}"

[[parameters]]
name = "prompt"
type = "string"
required = true
max_length = 32000

[[parameters]]
name = "image_count"
type = "integer"
min = 1
max = 1
default = 1
quantity = "image_count"

# BFL also offers 4k (about 16.8 MP, USD 0.036). It waits on a live check
# that its output fits Gongbu's artifact bound.
[[parameters]]
name = "image_size"
type = "enum"
values = ["768sq", "1k", "1.5k", "2k"]
required = true
selector = "image_size"

[[parameters]]
name = "aspect_ratio"
type = "enum"
values = ["21:9", "2:1", "16:9", "3:2", "7:5", "4:3", "5:4", "1:1", "4:5", "3:4", "5:7", "2:3", "9:16", "1:2", "9:21"]
default = "1:1"

[[parameters]]
name = "options.safety_tolerance"
type = "integer"
min = 0
max = 5

[poll]
job_id = "/id"
path = "/v1/get_result"
query = { id = "{{job_id}}" }
url = "/polling_url"
hosts = ["api.bfl.ai", "api.*.bfl.ai"]
interval_ms = 500
status = "/status"
pending = ["pending", "reasoning", "generating"]
ready = ["ready", "succeeded", "completed"]
rejected = { "request moderated" = "provider_request_moderated", "content moderated" = "provider_content_moderated", "error" = "provider_error", "failed" = "provider_error", "rejected" = "provider_rejected" }
ambiguous = { "task not found" = "provider_task_not_found" }

[response]
request_id_headers = ["x-request-id", "x-bfl-request-id"]
provider_request_id = "/request_id"
# BFL reports settled cost in credits; one credit is exactly USD 0.01.
reported_cost = "/cost"
reported_cost_scale = 2
artifact_items = "/result"
artifact_url = "/sample"

[artifacts]
media_types = ["image/png", "image/jpeg"]
hosts = ["delivery.*.bfl.ai"]

[[models]]
model = "flux-3-image-klein"
provider_config_version = "hubu-flux-3-image-klein-t2i-2026-10-29-v1"
pricing_version = "bfl-flux-3-image-klein-usd-2026-10-29-v1"
pricing_reviewed_on = "2026-10-29"

# USD 0.008 per 768sq image, USD 0.009 per 1k, USD 0.011 per 1.5k and
# USD 0.014 per 2k image, at any aspect ratio.
[[models.pricing_rules]]
rule_id = "bfl-flux-3-image-klein-768sq-2026-10-29-v1"
currency = "USD"
selector = { image_size = "768sq" }
components = [{ unit = "image", rate_numerator_minor = 8, rate_denominator = 10 }]

[[models.pricing_rules]]
rule_id = "bfl-flux-3-image-klein-1k-2026-10-29-v1"
currency = "USD"
selector = { image_size = "1k" }
components = [{ unit = "image", rate_numerator_minor = 9, rate_denominator = 10 }]

[[models.pricing_rules]]
rule_id = "bfl-flux-3-image-klein-1.5k-2026-10-29-v1"
currency = "USD"
selector = { image_size = "1.5k" }
components = [{ unit = "image", rate_numerator_minor = 11, rate_denominator = 10 }]

[[models.pricing_rules]]
rule_id = "bfl-flux-3-image-klein-2k-2026-10-29-v1"
currency = "USD"
selector = { image_size = "2k" }
components = [{ unit = "image", rate_numerator_minor = 14, rate_denominator = 10 }]
