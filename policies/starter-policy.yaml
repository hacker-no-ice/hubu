id: starter_spending_policy
version: starter-1
default_effect: needs_approval
rules:
  - id: deny_blocked_merchant
    effect: deny
    reason: merchant is blocked by the starter policy
    when:
      op: eq
      field: merchant
      value:
        string: blocked-merchant

  - id: allow_small_spend
    effect: allow
    reason: amount is within the starter single-spend limit of USD 100.00
    when:
      op: lte
      field: amount
      value:
        money: "100.00"
