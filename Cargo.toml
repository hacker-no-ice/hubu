[workspace]
members = [
    "crates/gongbu-api",
    "crates/gongbu-build-info",
    "crates/gongbu-mcp",
    "crates/hubu-api",
    "crates/hubu-bench",
    "crates/hubu-cli",
    "crates/hubu-common",
    "crates/hubu-core",
    "crates/hubu-mcp",
    "crates/hubu-wallet",
]
resolver = "2"

[workspace.package]
edition = "2021"
homepage = "https://github.com/hacker-no-ice/hubu#readme"
documentation = "https://github.com/hacker-no-ice/hubu/tree/main/docs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hacker-no-ice/hubu"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png"] }
tempfile = "3"
temporalio-sdk = "=0.6.0"
temporalio-macros = "=0.6.0"
temporalio-workflow = "=0.6.0"
temporalio-common-wasm = "=0.6.0"
temporalio-common = "=0.6.0"
futures = "0.3"
temporalio-client = "=0.6.0"
axum = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
security-framework = "3.7"

gongbu-build-info = { path = "crates/gongbu-build-info" }
hubu-common = { path = "crates/hubu-common" }
hubu-core = { path = "crates/hubu-core" }
hubu-wallet = { path = "crates/hubu-wallet" }
