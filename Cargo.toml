[workspace]
members = [
    "crates/hubu-api",
    "crates/hubu-common",
    "crates/hubu-core",
    "crates/hubu-mcp",
    "crates/hubu-wallet",
    "examples/authorize-payment",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/hubu"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

hubu-common = { path = "crates/hubu-common" }
hubu-core = { path = "crates/hubu-core" }
hubu-wallet = { path = "crates/hubu-wallet" }
