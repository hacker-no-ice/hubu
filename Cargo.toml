[workspace]
members = [
    "crates/hubu-api",
    "crates/hubu-bench",
    "crates/hubu-cli",
    "crates/hubu-common",
    "crates/hubu-core",
    "crates/hubu-mcp",
    "crates/hubu-wallet",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/hubu"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }

hubu-common = { path = "crates/hubu-common" }
hubu-core = { path = "crates/hubu-core" }
hubu-wallet = { path = "crates/hubu-wallet" }
